<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Choferes - Expreso Diemar</title>
    <style>
        :root {
            --bg-color: #121212;
            --primary: #007AFF;
            --danger: #FF3B30;
            --success: #34C759;
            --secondary: #E5E5EA;
        }
        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
        }
        /* --- FONDO CON IMAGEN DIFUMINADA --- */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('IMG_3101.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(35%);
            transform: scale(1.1);
            z-index: -1;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        /* --- LOGO --- */
        .logo-container {
            width: 70%;
            max-width: 240px;
            margin-bottom: 35px;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* --- BOTONES --- */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-ticket {
            background-color: var(--primary);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-checklist {
            background-color: var(--success);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-falla {
            background-color: rgba(255, 59, 48, 0.15);
            border: 2px solid var(--danger);
            color: var(--danger);
            backdrop-filter: blur(10px);
        }
        .btn-consulta {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--secondary);
            color: var(--secondary);
            backdrop-filter: blur(10px);
        }
        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            text-align: center;
        }
        /* --- MODAL CHECKLIST --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-sheet {
            width: 100%;
            max-width: 400px;
            background: #1C1C1E;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px;
            box-sizing: border-box;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
        }
        .modal-title {
            color: white;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-sheet .container {
            gap: 12px;
        }
        .btn-modal-digital {
            background-color: var(--success);
        }
        .btn-modal-foto {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }
        .btn-cancelar {
            background: transparent;
            color: rgba(255,255,255,0.5);
            box-shadow: none;
            height: 44px;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <div class="logo-container">
            <img src="logo_diemar4.png" alt="Expreso Diemar">
        </div>
        <div class="container">
            <a href="https://carga-combustible.vercel.app" class="btn btn-ticket">
                ⛽ Cargar Ticket
            </a>
            <button type="button" class="btn btn-checklist" onclick="abrirChecklist()">
                📋 Checklist Vehículo
            </button>
            <a href="https://forms.gle/EXfCVK2XAVfzUiE86" class="btn btn-falla">
                🛠️ Reportar Falla
            </a>
            <a href="https://nicolascolonna23.github.io/Consulta-Choferes/" class="btn btn-consulta">
                🔍 Consulta de Fallas
            </a>
        </div>
        <div class="footer">GESTIÓN DE FLOTA • EXPRESO DIEMAR</div>
    </div>

    <!-- Modal Checklist: elegir digital o foto -->
    <div class="modal-overlay" id="modalChecklist" onclick="cerrarChecklistFondo(event)">
        <div class="modal-sheet">
            <p class="modal-title">Checklist del vehículo</p>
            <div class="container">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSeB20B45agJhOoh1Ixms-HNLmRlzXdYYrec36l-mGwekVvSIw/viewform" class="btn btn-modal-digital">
                    ✍️ Completar digital
                </a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSc7xPEpPTCefmHZR005YuFaYj4a0jN678jGR1mAej81sAS97Q/viewform" class="btn btn-modal-foto">
                    📷 Subir foto del papel
                </a>
                <button type="button" class="btn btn-cancelar" onclick="cerrarChecklist()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        function abrirChecklist() {
            document.getElementById('modalChecklist').classList.add('open');
        }
        function cerrarChecklist() {
            document.getElementById('modalChecklist').classList.remove('open');
        }
        function cerrarChecklistFondo(e) {
            if (e.target.id === 'modalChecklist') cerrarChecklist();
        }
    </script>
</body>
</html>
